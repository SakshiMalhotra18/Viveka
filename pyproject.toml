[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viveka-engine"
version = "0.1.0"
description = "Property-based verification engine for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["ai", "agents", "verification", "property-testing", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "shellingham>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "python-ulid>=2",
    "pathspec>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[project.scripts]
viveka = "viveka.cli.app:app"

[project.urls]
Repository = "https://github.com/SakshiMalhotra18/Viveka"
Changelog = "https://github.com/SakshiMalhotra18/Viveka/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/viveka"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults (standard pattern in Typer)
]

[tool.ruff.lint.isort]
known-first-party = ["viveka"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore:.*is NOT an OS security sandbox.*:UserWarning",
]

[tool.coverage.run]
source = ["src/viveka"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
